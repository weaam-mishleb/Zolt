name: ETL (matrix) → Cloud DB

# Nationwide loader: one isolated job PER CHAIN, data pulled straight from Kaggle.
#
# Why a matrix:
#   • Isolation  — a malformed file in one chain cannot fail the other 32.
#   • Parallelism— wall time drops from ~25 min serial to ~8-10 min.
#   • Retry      — you re-run a single failed chain, not the whole load.
#   • Memory     — each runner streams one chain, so RAM stays ~90 MB.
#
# Why per-FILE Kaggle downloads (not `kaggle datasets download` of everything):
#   the dataset is ~14 GB. Pulling all of it in each of 33 jobs would move
#   ~460 GB per run. `-f <file>` fetches only the 3 files a chain needs.
#
# The chain list lives in etl/chains.json — adding a chain never touches this file.

on:
  schedule:
    - cron: "0 0 * * *"          # nightly 00:00 UTC ≈ 03:00 Israel
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated slugs to load (empty = all enabled)"
        default: ""
      full:
        description: "Use the full price catalog (true) or the lighter snapshot (false)"
        default: "true"
      load_promotions:
        description: "Also load promotion files (true/false)"
        default: "true"
      dataset:
        description: "Kaggle dataset id (owner/name) — leave empty for the default"
        default: ""

permissions:
  contents: read

concurrency:
  group: etl-nationwide          # never let two loads write to the DB at once
  cancel-in-progress: false

env:
  # Defaults to the dataset this project already targets (.env.example);
  # override per-run with the `dataset` input. Deliberately NOT a placeholder —
  # an unreplaced one once made every download fail while the jobs still went
  # green.
  # NOTE: the slug is `israeli-supermarkets-2024`; the dataset's TITLE is
  # "israeli-supermarkets-data", which is not the same thing. Using the title as
  # the ref returns 403 "Permission 'datasets.get' was denied" — not 404 — which
  # reads exactly like an auth failure and cost a long detour through tokens and
  # SMS verification. The preflight step below now names this outright.
  KAGGLE_DATASET: ${{ inputs.dataset || 'erlichsefi/israeli-supermarkets-2024' }}
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

jobs:
  # ── 1. Build the matrix + migrate the schema once ──────────────────────────
  plan:
    name: Plan chains
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - id: build
        shell: bash
        run: |
          set -euo pipefail
          MATRIX=$(python3 - '${{ inputs.chains }}' <<'PY'
          import json, sys
          wanted = {s.strip() for s in (sys.argv[1] or "").split(",") if s.strip()}
          chains = json.load(open("etl/chains.json"))["chains"]
          sel = [c for c in chains if c.get("enabled", True)]
          if wanted:
              sel = [c for c in sel if c["slug"] in wanted]
          if not sel:
              sys.exit("No chains selected — check etl/chains.json or the 'chains' input")
          print(json.dumps({"include": [{"slug": c["slug"], "name": c["name"]} for c in sel]}))
          PY
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$MATRIX")" >> "$GITHUB_OUTPUT"

      # Runs once, before any loader — creating tables inside 33 parallel jobs
      # would race.
      - name: Apply schema + migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
        run: |
          pip install -r etl/requirements.txt
          # Say WHICH layer is broken before spending 8 retries and a 100-line
          # traceback on "Lost connection to MySQL server during query" — a
          # message that covers a refused socket, a proxy with nothing behind
          # it, bad credentials and a genuinely dropped query alike. A real
          # outage once read as a client bug and cost two full runs.
          python -m scripts.db_probe --github
          python -m scripts.init_db

      # Fail once, here, with a precise reason — not 30 identical times in the
      # matrix.
      #
      # Kaggle answers an unknown or invisible dataset ref with
      #     403 "Permission 'datasets.get' was denied"
      # rather than 404. That reads exactly like an auth failure, and it cost a
      # long detour through fresh API tokens, SMS verification and re-entering
      # secrets before the real cause surfaced: the ref was the dataset's TITLE
      # ("israeli-supermarkets-data") instead of its slug
      # ("israeli-supermarkets-2024"). This step tells the two apart by probing
      # credentials separately from the dataset.
      - name: Preflight — Kaggle credentials and dataset access
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
            echo "::error::KAGGLE_USERNAME / KAGGLE_KEY secrets are not set"
            exit 1
          fi

          # Probe auth on its own, against something every account can see.
          if ! kaggle datasets list -s titanic >/dev/null 2>&1; then
            echo "::error::Kaggle rejected these credentials — the API key is invalid or revoked. Generate a new token at Kaggle → Settings → API and update the repository secrets."
            exit 1
          fi
          echo "· credentials accepted by Kaggle"

          if ! kaggle datasets files "$KAGGLE_DATASET" >/dev/null 2>&1; then
            echo "::error::Credentials are VALID, but dataset '$KAGGLE_DATASET' is not reachable — this is a wrong dataset ref, not a permissions problem."
            echo "Kaggle returns 403 'Permission datasets.get was denied' (not 404) for a ref that does not exist or is private."
            echo "The ref is the slug in the dataset URL, which is NOT necessarily the dataset's title."
            echo "Find the real slug with:  kaggle datasets list -s '<search terms>'"
            exit 1
          fi
          echo "· dataset $KAGGLE_DATASET is reachable"

  # ── 2. One isolated job per chain ──────────────────────────────────────────
  load:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false            # one bad chain must not cancel the rest
      max-parallel: 4             # cap concurrent writers so the DB pool holds
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SSL: "true"
      # The ETL is single-threaded and needs ONE connection. The pool defaults in
      # backend/app/config.py are sized for the API (10 + 20 overflow), which
      # across six runners is up to 180 connections against one managed MySQL —
      # past its limit the proxy stops completing handshakes and PyMySQL raises
      # 2013 from _get_server_information. etl/__init__.py sets the same defaults;
      # they are repeated here so the number is visible where the fan-out is.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      CHAIN: ${{ matrix.slug }}   # ← the matrix value, as an env var
      FULL: ${{ inputs.full || 'true' }}
      LOAD_PROMOTIONS: ${{ inputs.load_promotions || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r etl/requirements.txt      # includes the kaggle package

      - name: Verify Kaggle credentials
        run: |
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
            echo "::error::KAGGLE_USERNAME / KAGGLE_KEY secrets are not set"
            exit 1
          fi
          kaggle --version

      # Only this chain's files — the CLI reads KAGGLE_USERNAME/KAGGLE_KEY from
      # the environment, so no kaggle.json ever touches the disk.
      - name: Download ${{ matrix.slug }} files from Kaggle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          PRICE="price_file_${CHAIN}.csv"
          [ "$FULL" = "false" ] || PRICE="price_full_file_${CHAIN}.csv"

          # Promo files are optional (not every chain publishes one); the store
          # and price files are NOT — without them the load is meaningless.
          OPTIONAL=( )
          [ "$LOAD_PROMOTIONS" != "true" ] || OPTIONAL+=( "promo_file_${CHAIN}.csv" )

          # Two different things look like "no file", and they must not share a
          # fate. A 404 means the upstream scraper did not publish this chain
          # today — nothing is wrong on our side and there is nothing to load.
          # Anything else (auth, network, a broken dataset ref) is our problem
          # and has to stay loud: swallowing it is exactly what once produced 26
          # green jobs holding zero rows.
          NOT_PUBLISHED=0
          for f in "store_file_${CHAIN}.csv" "$PRICE" "${OPTIONAL[@]}"; do
            echo "→ $f"
            if ! out=$(kaggle datasets download -d "$KAGGLE_DATASET" -f "$f" \
                         -p archive --force --unzip 2>&1); then
              echo "$out"
              if grep -qiE '404|not found' <<<"$out"; then
                echo "::warning::$f is not in the dataset today (404)"
                # Only a REQUIRED file turns this into a skip.
                case "$f" in
                  "store_file_${CHAIN}.csv"|"$PRICE") NOT_PUBLISHED=1 ;;
                esac
              else
                echo "::error::download of $f failed for a reason other than 404"
                echo "Dataset '$KAGGLE_DATASET' was reachable at preflight, so this is not the ref."
                exit 1
              fi
            fi
          done

          # A single-file download can still arrive zipped depending on size.
          for z in archive/*.zip; do [ -e "$z" ] && unzip -o "$z" -d archive && rm -f "$z"; done || true
          ls -lh archive

          if [ "$NOT_PUBLISHED" = "1" ]; then
            echo "::warning::${CHAIN}: upstream published no data today — skipping this chain"
            # Recorded where a human will actually see it. A silent skip that
            # nobody notices is how a chain quietly disappears for weeks.
            echo "⚠️ **${CHAIN}** skipped — upstream published no file today (404)" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP_CHAIN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # HARD GATE, still. Files that downloaded but are EMPTY mean the
          # download half-worked, which is a real failure, not an absent chain.
          for required in "store_file_${CHAIN}.csv" "$PRICE"; do
            if [ ! -s "archive/$required" ]; then
              echo "::error::required file present but empty after download: $required"
              echo "This is not an absent chain — the download itself failed."
              exit 1
            fi
          done

      - name: Load prices — ${{ matrix.name }}
        if: env.SKIP_CHAIN != 'true'
        run: |
          # Batch size raised from 1000: over a WAN link the per-batch round trip
          # and commit dominate, so a chain of 1.3M prices paid ~1,300 of them.
          FLAGS="--chains $CHAIN --batch-size 4000"
          [ "$FULL" = "false" ] || FLAGS="$FLAGS --full"
          python -m etl.run $FLAGS

      # Canonical ids must exist before promotion items can link to them.
      #
      # --chains is not optional here. Unscoped, all six concurrent runners
      # resolved every product in the database, produced identical groupings,
      # and then each rewrote all ~178k canonical_products rows to refresh
      # member_count — the redundant work was cheap, the lock contention was
      # what timed the workflow out. Scoped, a runner touches only the products
      # its own chain prices.
      #
      # Grouping stays cross-chain regardless: canonical_products is
      # UNIQUE(name_norm, size_signature) and the write is an upsert, so the
      # second chain to meet a blocking key joins the existing row.
      - name: Resolve canonical products — ${{ matrix.name }}
        if: env.SKIP_CHAIN != 'true'
        run: python -m etl.canonical --chains "$CHAIN"

      - name: Load promotions — ${{ matrix.name }}
        if: env.LOAD_PROMOTIONS == 'true' && env.SKIP_CHAIN != 'true'
        run: python -m etl.promotions --chains "$CHAIN"

      # Verifies the chain's data is actually IN the database. A green job that
      # loaded nothing is worse than a red one — it looks like success.
      # Skipped only when the chain published nothing at all; a chain that
      # DID download still has to prove its rows reached the database.
      - name: Data-quality gate
        if: env.SKIP_CHAIN != 'true'
        run: python -m scripts.dq_check --chain "$CHAIN"

  # ── 3. Always report, even when some chains failed ─────────────────────────
  report:
    name: Summary
    needs: [plan, load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Nationwide ETL — ${{ needs.plan.outputs.count }} chains" >> $GITHUB_STEP_SUMMARY
          echo "Loader result: **${{ needs.load.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Per-chain detail: the job list above, or \`SELECT * FROM etl_jobs ORDER BY id DESC\`." >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.load.result }}" = "failure" ]; then
            echo "::warning::One or more chains failed — the rest loaded successfully."
          fi
