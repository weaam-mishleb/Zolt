name: ETL (matrix) → Cloud DB

# Nationwide loader: one isolated job PER CHAIN instead of one monolithic run.
#
# Why a matrix:
#   • Isolation  — a malformed file in one chain can no longer fail the other 32.
#   • Parallelism— wall time drops from ~25 min serial to ~8-10 min.
#   • Retry      — you re-run a single failed chain, not the whole nationwide load.
#   • Visibility — every chain gets its own etl_jobs row and its own GH Actions log.
#
# The chain list lives in etl/chains.json (single source of truth) — adding a chain
# never requires editing this file.

on:
  schedule:
    - cron: "0 0 * * *"        # nightly 00:00 UTC ≈ 03:00 Israel
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated slugs to load (empty = all enabled)"
        default: ""
      full:
        description: "Load the full price catalog (true/false)"
        default: "true"
      load_promotions:
        description: "Also load promotion files (true/false)"
        default: "true"

permissions:
  contents: read

concurrency:
  group: etl-nationwide
  cancel-in-progress: false     # never interrupt a load midway

jobs:
  # ── 1. Build the matrix from etl/chains.json ────────────────────────────────
  plan:
    name: Plan chains
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        shell: bash
        run: |
          set -euo pipefail
          FILTER='${{ inputs.chains }}'
          MATRIX=$(python3 - "$FILTER" <<'PY'
          import json, sys
          wanted = {s.strip() for s in (sys.argv[1] or "").split(",") if s.strip()}
          chains = json.load(open("etl/chains.json"))["chains"]
          sel = [c for c in chains if c.get("enabled", True)]
          if wanted:
              sel = [c for c in sel if c["slug"] in wanted]
          if not sel:
              sys.exit("No chains selected — check etl/chains.json or the 'chains' input")
          print(json.dumps({"include": [{"slug": c["slug"], "name": c["name"]} for c in sel]}))
          PY
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"

      - name: Apply schema / migrations once (before any loader runs)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
        run: |
          pip install -r etl/requirements.txt
          python -m scripts.init_db

  # ── 2. One isolated job per chain ───────────────────────────────────────────
  load:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false            # one bad chain must not cancel the rest
      max-parallel: 6             # cap concurrent writers so the DB pool isn't saturated
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SSL: "true"
      DATA_TAG: dataset-v1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DATASET: erlichsefi/israeli-supermarkets-data
      LOAD_PROMOTIONS: ${{ inputs.load_promotions || 'true' }}
      FULL: ${{ inputs.full || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r etl/requirements.txt

      # Only this chain's files are staged — keeps each runner's disk small.
      - name: Stage data for ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          cp "db/seed_stores/store_file_${{ matrix.slug }}.csv" archive/ 2>/dev/null || true
          if [ -n "$KAGGLE_KEY" ]; then
            mkdir -p secrets
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > secrets/kaggle.json
            chmod 600 secrets/kaggle.json
            python -c "import os; from etl.downloaders.kaggle_download import download_dataset; \
                       download_dataset(os.environ['KAGGLE_DATASET'])"
            rm -f secrets/kaggle.json
            echo "DATA_SOURCE=kaggle (fresh)" >> "$GITHUB_ENV"
          else
            gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" \
               -p "*_${{ matrix.slug }}.csv.gz" -D archive || true
            gunzip -f archive/*.gz 2>/dev/null || true
            echo "DATA_SOURCE=release $DATA_TAG (pinned)" >> "$GITHUB_ENV"
          fi
          ls -lh archive | head

      - name: Load prices — ${{ matrix.name }}
        run: |
          FLAGS="--chains ${{ matrix.slug }} --batch-size 1000"
          [ "$FULL" = "false" ] || FLAGS="$FLAGS --full"
          python -m etl.run $FLAGS

      - name: Load promotions — ${{ matrix.name }}
        if: env.LOAD_PROMOTIONS == 'true'
        run: python -m etl.promotions --chains ${{ matrix.slug }}

      - name: Data-quality gate
        run: python -m scripts.dq_check --chain ${{ matrix.slug }}

  # ── 3. Always report, even if some chains failed ────────────────────────────
  report:
    name: Summary
    needs: [plan, load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "### Nationwide ETL — ${{ needs.plan.outputs.count }} chains" >> $GITHUB_STEP_SUMMARY
          echo "Loader result: **${{ needs.load.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Per-chain detail: see the job list above, or query \`etl_jobs\` (one row per chain)." >> $GITHUB_STEP_SUMMARY
          [ "${{ needs.load.result }}" = "failure" ] && echo "::warning::One or more chains failed — the rest loaded successfully." || true
          exit 0
