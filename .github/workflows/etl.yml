name: ETL → Cloud DB

# Loads the full catalog into the cloud DB from GitHub's fast US runners, so a
# slow/distant local link is no longer the bottleneck.
#
# Data source: the price files are mirrored as GZIPPED assets on a GitHub Release
# of THIS repo, so NO Kaggle account/key is needed — they're pulled with the
# built-in GITHUB_TOKEN. The tiny store CSVs are committed in db/seed_stores/.
# One-time setup: create a release (default tag "dataset-v1") and upload the 3
# files archive/price_full_file_*.csv.gz (see DEPLOYMENT.md).
on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC ≈ 03:00 Israel — weekly refresh (SRS FR-1.4)
  workflow_dispatch:
    inputs:
      data_tag:
        description: "Release tag holding the *.csv.gz price files"
        default: "dataset-v1"
      job_id:
        description: "etl_jobs row id to report progress into (set by the admin dispatch; leave empty to create a new row)"
        default: ""
      full:
        description: "Load the full price catalog (true/false)"
        default: "true"

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATA_TAG: ${{ inputs.data_tag || 'dataset-v1' }}
      # Optional: set these repo secrets to make the weekly run load FRESH data.
      # Without them the run falls back to the pinned release snapshot below.
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DATASET: erlichsefi/israeli-supermarkets-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      # Preferred source: the live Kaggle mirror, so the weekly cron actually
      # refreshes prices instead of re-loading one frozen snapshot forever.
      - name: Fetch fresh dataset from Kaggle (when configured)
        if: env.KAGGLE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets archive
          cp db/seed_stores/*.csv archive/
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > secrets/kaggle.json
          chmod 600 secrets/kaggle.json
          python -c "import os; from etl.downloaders.kaggle_download import download_dataset; \
                     download_dataset(os.environ['KAGGLE_DATASET'])"
          rm -f secrets/kaggle.json
          echo "DATA_SOURCE=kaggle (fresh)" >> "$GITHUB_ENV"
          ls -lh archive

      # Fallback: the pinned release snapshot (no Kaggle account needed).
      - name: Stage pinned snapshot (committed stores + release price files)
        if: env.KAGGLE_KEY == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          cp db/seed_stores/*.csv archive/
          gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" -p '*.csv.gz' -D archive
          gunzip -f archive/*.gz
          echo "DATA_SOURCE=release $DATA_TAG (pinned snapshot)" >> "$GITHUB_ENV"
          ls -lh archive

      - name: Report data source
        run: echo "Loading from → $DATA_SOURCE"

      - name: Initialize schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"                # Railway MySQL needs a TLS handshake
        run: python -m scripts.init_db

      - name: Run ETL → cloud DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
          ETL_JOB_ID: ${{ inputs.job_id }}   # progress reported into this etl_jobs row
        shell: bash
        run: |
          FLAGS="--batch-size 1000"   # fast low-latency link → larger batches
          if [ "${{ inputs.full }}" != "false" ]; then FLAGS="$FLAGS --full"; fi
          python -m etl.run $FLAGS
