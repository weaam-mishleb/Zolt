name: Tests

# CI gate: the unit suite runs on every push/PR to main, so a broken commit is
# caught before Render/Vercel auto-deploy it. The suite is DB-free by design
# (services take injected rows), so no MySQL service container is needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_ENABLED: "false"   # never start APScheduler inside CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (real errors only — unused names, undefined refs, syntax)
        run: ruff check backend/app etl scripts --select F,E9

      - name: Run unit tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
